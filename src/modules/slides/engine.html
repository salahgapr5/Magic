<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Poppins:wght@600;700&family=Inter:wght@500;600&family=Noto+Sans+Arabic:wght@600&display=swap" rel="stylesheet">
<title>Audio to SVG Timeline</title>
<style>
main{display:none}
:root{--bg:#f4f1ec;--ink:#1e2a38;--mut:#6b7684;--line:#d9d3c9;--acc:#2f6fb5;--card:#fff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Avenir Next",Avenir,"Segoe UI",sans-serif}
main{max-width:1100px;margin:0 auto;padding:24px 16px 60px}
h1{font-size:26px;margin:0 0 4px}p.sub{margin:0 0 18px;color:var(--mut)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
label{display:block;font-size:13px;color:var(--mut);margin-bottom:3px}
input,select,textarea{width:100%;padding:8px;border:1px solid var(--line);border-radius:6px;font:inherit;background:#fff;color:var(--ink)}
button{padding:9px 14px;border:0;border-radius:6px;background:var(--acc);color:#fff;font:inherit;cursor:pointer}
button.alt{background:#e8e3da;color:var(--ink)}button:disabled{opacity:.5;cursor:wait}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #f2b34c;outline-offset:1px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
#status{color:var(--mut);font-size:14px}#status.err{color:#b3261e}
audio{width:100%;margin-top:10px}
#tl{position:relative;height:46px;background:#ebe6dd;border-radius:6px;margin-top:12px;overflow:hidden}
.seg{position:absolute;top:0;height:100%;border-right:2px solid #fff;background:#a9c7e8;color:var(--ink);font-size:12px;padding:4px;cursor:pointer;overflow:hidden;white-space:nowrap}
.seg.on{background:var(--acc);color:#fff}
#head{position:absolute;top:0;width:2px;height:100%;background:#d4382c;pointer-events:none}
#view{margin-top:12px;border-radius:8px;overflow:hidden;background:#ddd;aspect-ratio:16/9}
#view svg,.thumb svg{width:100%;height:100%;display:block}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;margin-top:14px}
.card{border:1px solid var(--line);border-radius:8px;padding:10px;background:#fff}
.card.on{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc)}
.thumb{aspect-ratio:16/9;border-radius:6px;overflow:hidden;background:#eee;cursor:pointer}
.card h4{margin:8px 0 6px;font-size:14px}.card .row{margin-top:6px}
.card input{width:76px}.card button{padding:5px 9px;font-size:13px}
details pre{white-space:pre-wrap;max-height:220px;overflow:auto;font-size:13px;margin:8px 0 0}
h3{font-size:14px;margin:16px 0 8px;color:var(--acc)}h3:first-child{margin-top:0}#view{contain:paint}
#view .a-fade,#view .a-up,#view .a-pop,#view .a-icon{animation-fill-mode:both;animation-timing-function:cubic-bezier(.22,1,.36,1);animation-duration:.7s;animation-delay:var(--d,0s);transform-box:fill-box;transform-origin:center}
#view .a-fade{animation-name:fadeIn}#view .a-up{animation-name:up}#view .a-pop{animation-name:pop}
#view .a-icon{animation-name:pop;animation-delay:calc(var(--d,0s) + .3s)}
#view .a-draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw .9s ease-out both;animation-delay:calc(var(--d,0s) + .4s)}
#view .a-breathe{animation:breathe 4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
#view .a-beat{animation:beat 1.6s ease-in-out 1.2s 3;transform-box:fill-box;transform-origin:center}
#view .a-pulse{animation:pulse 1.2s ease-in-out 1s 3;transform-box:fill-box;transform-origin:center}
#view .a-spin{animation:spin 30s linear infinite;transform-box:fill-box;transform-origin:center}
#view.m-subtle{--t:14px;--s:.92}#view.m-lively{--t:36px;--s:.5}
#view.m-lively .a-spin{animation-duration:12s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes up{from{opacity:0;transform:translateY(var(--t,14px))}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(var(--s,.92))}60%{transform:scale(1.05)}to{opacity:1;transform:none}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes breathe{50%{transform:scaleY(1.012)}}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.08)}30%{transform:scale(1)}45%{transform:scale(1.06)}}
@keyframes pulse{50%{transform:scale(1.08)}}
@keyframes spin{to{transform:rotate(360deg)}}
#view.m-off *{animation:none!important}#view.m-off .a-draw{stroke-dasharray:none;stroke-dashoffset:0}
@media(prefers-reduced-motion:reduce){#view *{animation:none!important}#view .a-draw{stroke-dasharray:none;stroke-dashoffset:0}}
/* 3D clay UI */
:root{--bg:#cfe6ff;--ink:#12306b;--mut:#4d6a9c;--line:#d4e5fb;--acc:#2f7bff}
body{background:radial-gradient(1100px 700px at 10% -10%,#eaf5ff 0,transparent 60%),radial-gradient(900px 700px at 100% 25%,#8ec5ff 0,transparent 55%),linear-gradient(160deg,#a9d4ff,#4d8dff 70%,#6b6dff);background-attachment:fixed;font-family:"Poppins","Inter","Segoe UI",sans-serif}
h1{font-weight:700;font-size:30px;color:#fff;text-shadow:0 3px 0 #2a63d6,0 10px 20px #0b2a7866}p.sub{color:#eaf3ff}
.panel{background:linear-gradient(180deg,#fff,#f1f7ff);border:2px solid #fff;border-radius:28px;padding:20px;box-shadow:0 18px 40px -12px #12348a77,inset 0 -6px 0 #dbe9ff}
h3{color:#2f7bff}
input,select,textarea{border:2px solid #d4e5fb;border-radius:14px;background:#f7fbff;box-shadow:inset 0 3px 6px #12348a1a}
button{border-radius:16px;font-weight:600;background:linear-gradient(180deg,#6aa9ff,#2f6df0);box-shadow:inset 0 2px 0 #ffffff99,0 6px 0 #1f4fc2,0 12px 18px #12348a55;transition:transform .08s,box-shadow .08s}
button:active:not(:disabled){transform:translateY(4px);box-shadow:inset 0 2px 0 #ffffff99,0 2px 0 #1f4fc2,0 6px 10px #12348a55}
button.alt{background:linear-gradient(180deg,#fff,#e4efff);color:#1f4fc2;box-shadow:inset 0 2px 0 #fff,0 5px 0 #bcd3f5,0 10px 16px #12348a33}
button.alt:active:not(:disabled){box-shadow:inset 0 2px 0 #fff,0 1px 0 #bcd3f5,0 4px 8px #12348a33}
#tl{height:52px;background:#dbe9ff;border-radius:18px;box-shadow:inset 0 4px 8px #12348a22}
.seg{background:linear-gradient(180deg,#d7e8ff,#b4d3fb);border-right:3px solid #fff;color:#12306b;font-weight:600}
.seg.on{background:linear-gradient(180deg,#6aa9ff,#2f6df0);color:#fff}
#view{border-radius:24px;box-shadow:0 20px 40px -10px #12348a88,0 0 0 4px #fff}
.card{border:2px solid #fff;border-radius:22px;background:linear-gradient(180deg,#fff,#eef5ff);box-shadow:0 12px 24px -8px #12348a55,inset 0 -4px 0 #dbe9ff}
.card.on{border-color:#2f7bff;box-shadow:0 0 0 3px #2f7bff,0 12px 24px -8px #12348a55}
.thumb{border-radius:16px}
</style></head><body><main>
<h1>Audio to SVG timeline</h1>
<p class="sub">Upload audio. Groq transcribes it, OpenAI picks the moments and writes an SVG for each one, and the images land on a timeline.</p>

<section class="panel">
 <h3>1. Connect</h3><div class="grid">
  <div><label for="gk">Groq API key</label><input id="gk" type="password" autocomplete="off"></div>
  <div><label for="ok">OpenAI API key</label><input id="ok" type="password" autocomplete="off"></div>
  <div><label for="model">OpenAI model</label><input id="model" value="gpt-5.6-sol"></div>
  <div><label for="topic">Topic / tone (optional)</label><input id="topic" placeholder="auto-detect"></div></div>
 <h3>2. Audio and pacing</h3><div class="grid">
  <div><label for="file">Audio file</label><input id="file" type="file" accept="audio/*,video/mp4"></div>
  <div><label for="gap">One image every (seconds)</label><input id="gap" type="number" min="5" max="120" value="20"></div></div>
 <h3>3. Visual style</h3><div class="grid">
  <div><label for="style">Style</label><select id="style"></select></div>
  <div><label for="anim">Animation</label><select id="anim"><option value="subtle">Subtle</option><option value="lively">Lively</option><option value="off">Off</option></select></div>
  <div><label for="isrc">Icons</label><select id="isrc"><option value="mine" selected>My 3D library, then online</option><option value="auto">Online library (thousands of icons)</option><option value="builtin">Built-in only (offline)</option></select></div>
  </div>
 <audio id="au" controls></audio>
 <div class="row">
  <button id="go">1. Transcribe and create images</button>
  <button id="again" class="alt" disabled>Make images again (same transcript)</button>
  <span id="status"></span>
 </div>
 <details><summary>Transcript</summary><pre id="tx">Nothing yet.</pre></details>
</section>

<section class="panel">
 <div class="row" style="margin-top:0"><strong>Timeline</strong><button id="replay" class="alt">Replay animation</button>
  <button id="dlj" class="alt" disabled>Save project JSON</button><button id="dlv" class="alt" disabled>Export video (WebM)</button></div>
 <div id="tl"><div id="head"></div></div>
 <div id="view"></div>
 <div class="cards" id="cards"></div>
</section>
</main>

  if(!tx)continue;say(k>1?`Planning slides (part ${c+1} of ${k})...`:'Planning slides with OpenAI...');

$('dlv').onclick=async()=>{const b=$('dlv');b.disabled=true;
 try{const au=$('au');if(!au.src)throw new Error('Choose an audio file first.');if(!window.MediaRecorder)throw new Error('This browser cannot record video.');
  say('Preparing video...');const fc=await fontCss(),imgs=await Promise.all(S.scenes.map(sc=>new Promise(r=>{if(!sc.svg)return r(null);const im=new Image();im.onload=()=>r(im);im.onerror=()=>r(null);im.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(fc?sc.svg.replace(/^(<svg[^>]*>)/,'$1<style>'+fc+'</style>'):sc.svg)}))),
  c=document.createElement('canvas');c.width=1280;c.height=720;const g=c.getContext('2d'),AC=window._ac||(window._ac=new(window.AudioContext||window.webkitAudioContext)());
  if(!ASRC){ASRC=AC.createMediaElementSource(au);ASRC.connect(AC.destination)}
  const dst=AC.createMediaStreamDestination();ASRC.connect(dst);const st=c.captureStream(30);dst.stream.getAudioTracks().forEach(t=>st.addTrack(t));
  const mt=['video/webm;codecs=vp9,opus','video/webm'].find(m=>MediaRecorder.isTypeSupported(m)),rec=new MediaRecorder(st,{mimeType:mt}),ch=[];
  rec.ondataavailable=e=>e.data.size&&ch.push(e.data);const stopped=new Promise(r=>rec.onstop=r);
  await AC.resume();au.currentTime=0;rec.start();await au.play();say('Recording in real time. Keep this tab open and in front.');
  await new Promise(res=>{(function tick(){const t=au.currentTime;let k=0;S.scenes.forEach((s,i)=>{if(s.start<=t)k=i});g.fillStyle='#000';g.fillRect(0,0,1280,720);if(imgs[k])g.drawImage(imgs[k],0,0,1280,720);if(au.ended){res();return}requestAnimationFrame(tick)})()});
  rec.stop();await stopped;ASRC.disconnect(dst);save('timeline.webm',new Blob(ch,{type:'video/webm'}));say('Video saved.')}
 catch(e){say(e.message,1)}b.disabled=false};

/* ===== Headless API (added for SalMedia Pipeline Part 1) ===== */
window.SLIDEAPI={
 styles:Object.keys(STY),
 layouts:LAYS.slice(),
 libSize:LIB.length,
 // One slide from the spoken words of one B-roll item. Returns {svg,layout,headline,libs}.
 async makeSlide(o){
  $('ok').value=o.key||'';$('model').value=o.model||'gpt-5.6-sol';$('style').value=STY[o.style]?o.style:'clay';
  $('isrc').value=o.icons||'mine';$('topic').value=o.topic||'';
  const keep=+o.start||0,sc={start:keep};
  const lay=LAYS.includes(o.layout)?` Use the layout "${o.layout}" if it fits the words; if it does not fit, pick the closest one.`:'';
  const avL=o.avoidLayout?` Do not use the layout "${o.avoidLayout}".`:'';
  const avI=(o.avoidLibs&&o.avoidLibs.length)?` Pick different icons than: ${o.avoidLibs.join(', ')}.`:'';
  const out=await gpt([{role:'system',content:SYS()},{role:'user',content:`Write ONE slide (scenes array with one item, start ${keep}) for these spoken words.${lay}${avL}${avI}\n\nSpoken words:\n${String(o.text||'').slice(0,1200)}\n${SPEC+libHint(o.text||'')}`}],true);
  let J;try{J=JSON.parse(out).scenes[0]}catch(e){throw new Error('OpenAI returned an invalid slide.')}
  if(!J)throw new Error('OpenAI returned no slide.');
  fixScenes([J]);await pickIcons([J],new Set(o.avoidLibs||[]));await resolveIcons([J],$('style').value);bake(J);
  if(!J.svg)throw new Error(J.err||'Slide could not be drawn.');
  return{svg:J.svg,layout:J.layout,headline:J.headline||'',libs:[...libsOf(J)]};
 },
 // SVG text -> 1920x1080 PNG data URL. Text is drawn by the engine, so no spelling errors.
 async toPng(svg,w,h){
  w=w||1920;h=h||1080;const fc=await fontCss();
  const s=fc?svg.replace(/^(<svg[^>]*>)/,'$1<style>'+fc+'</style>'):svg;
  return await new Promise((res,rej)=>{const img=new Image();
   img.onload=()=>{const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);res(c.toDataURL('image/png'))};
   img.onerror=()=>rej(new Error('SVG could not be turned into PNG.'));
   img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(s)});
 },
 // Offline test helper: draw a slide from a ready scene (no OpenAI call).
 bakeScene(sc,style,icons){$('style').value=STY[style]?style:'clay';$('isrc').value=icons||'builtin';fixScenes([sc]);bake(sc);return sc}
};
